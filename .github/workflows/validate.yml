name: validate
on: [pull_request, push]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/marketplace.json plugins/claude-code/.claude-plugin/plugin.json cli/package.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: CLI tests
        run: cd cli && npm test
      # Pinned to the Claude Code version the gates are measured with locally; bump it on purpose, not by drift.
      - name: Claude Code plugin validate (strict)
        run: npx -y @anthropic-ai/claude-code@2.1.311 plugin validate --strict ./plugins/claude-code
      # The marketplace manifest has no description yet, which --strict would turn into a failure.
      - name: Claude Code marketplace validate
        run: npx -y @anthropic-ai/claude-code@2.1.311 plugin validate .
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node-version }}" }
      - name: Plugin hook tests
        run: node --test plugins/claude-code/hooks/test/*.test.mjs
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node-version }}" }
      - name: Install the pinned SDK for the journey suite
        run: npm ci --ignore-scripts --prefix test/journey
      - name: Journey unit suite
        run: cd test/journey && node --test test/*.test.mjs
