name: validate
on: [pull_request, push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/marketplace.json plugins/claude-code/.claude-plugin/plugin.json cli/package.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: CLI tests
        run: cd cli && npm test
      - name: Claude Code plugin validate
        run: npx -y @anthropic-ai/claude-code plugin validate ./plugins/claude-code
